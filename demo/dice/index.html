<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Game</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="game-container">
      <!-- Recent Rolls History Bar -->
      <div class="history-bar">
        <!-- History items will be dynamically added here -->
      </div>

      <!-- Left Panel: Betting Controls -->
      <div class="betting-controls">
        <!-- User Balance -->
        <div class="balance-container">
          <div class="balance-label">余额</div>
          <div class="balance-amount" id="userBalance">1000.00 USD</div>
        </div>

        <!-- Mode Tabs -->
        <div class="mode-tabs">
          <button class="tab active" id="manualTab">Manual</button>
          <button class="tab" id="autoTab">
            Auto <i class="fas fa-bolt"></i>
          </button>
        </div>

        <!-- Manual Mode Controls -->
        <div id="manualControls" class="mode-controls active">
          <!-- Bet Amount -->
          <div class="control-section">
            <div class="control-label">Bet Amount</div>
            <div class="amount-display">$0.00</div>
            <div class="input-container">
              <input
                type="text"
                class="amount-input"
                id="betAmount"
                value="0.00000000"
              />
              <div class="quick-actions">
                <button class="quick-btn">½</button>
                <button class="quick-btn">2×</button>
              </div>
            </div>
          </div>

          <!-- Profit on Win -->
          <div class="control-section">
            <div class="control-label">Profit on Win</div>
            <div class="amount-display">$0.00</div>
            <div class="input-container">
              <input
                type="text"
                class="amount-input"
                id="profitOnWin"
                value="0.00000000"
                readonly
              />
              <div class="info-icon">
                <i class="fas fa-info-circle"></i>
              </div>
            </div>
          </div>

          <!-- Bet Button -->
          <button class="bet-button" id="betButton">Bet</button>
        </div>

        <!-- Auto Mode Controls -->
        <div id="autoControls" class="mode-controls">
          <!-- Bet Amount -->
          <div class="control-section">
            <div class="control-label">Bet Amount</div>
            <div class="amount-display">$0.00</div>
            <div class="input-container">
              <input
                type="text"
                class="amount-input"
                id="autoBetAmount"
                value="0.00000000"
              />
              <div class="quick-actions">
                <button class="quick-btn">½</button>
                <button class="quick-btn">2×</button>
              </div>
            </div>
          </div>

          <!-- Number of Bets -->
          <div class="control-section">
            <div class="control-label">Number of Bets</div>
            <div class="input-container">
              <input
                type="number"
                class="amount-input"
                id="numberOfBets"
                value="10"
                min="1"
                max="1000"
              />
            </div>
          </div>

          <!-- Speed Control -->
          <div class="control-section">
            <div class="control-label">投注速度</div>
            <div class="speed-container">
              <button class="speed-btn" data-speed="slow">慢速</button>
              <button class="speed-btn active" data-speed="normal">中速</button>
              <button class="speed-btn" data-speed="fast">快速</button>
              <button class="speed-btn" data-speed="turbo">极速</button>
            </div>
          </div>

          <!-- On Win -->
          <div class="control-section">
            <div class="control-label">On Win</div>
            <div class="select-container">
              <select id="onWinAction" class="select-input">
                <option value="reset">Reset to base</option>
                <option value="increase">Increase by</option>
                <option value="decrease">Decrease by</option>
              </select>
              <input
                type="number"
                id="onWinValue"
                class="amount-input"
                value="0"
                min="0"
                step="0.01"
                disabled
              />
            </div>
          </div>

          <!-- On Loss -->
          <div class="control-section">
            <div class="control-label">On Loss</div>
            <div class="select-container">
              <select id="onLossAction" class="select-input">
                <option value="reset">Reset to base</option>
                <option value="increase">Increase by</option>
                <option value="decrease">Decrease by</option>
              </select>
              <input
                type="number"
                id="onLossValue"
                class="amount-input"
                value="0"
                min="0"
                step="0.01"
                disabled
              />
            </div>
          </div>

          <!-- Stop Conditions -->
          <div class="control-section">
            <div class="control-label">Stop on Profit</div>
            <div class="input-container">
              <input
                type="number"
                id="stopOnProfit"
                class="amount-input"
                value="0"
                min="0"
                step="0.01"
              />
            </div>
          </div>

          <div class="control-section">
            <div class="control-label">Stop on Loss</div>
            <div class="input-container">
              <input
                type="number"
                id="stopOnLoss"
                class="amount-input"
                value="0"
                min="0"
                step="0.01"
              />
            </div>
          </div>

          <!-- Auto Bet Buttons -->
          <button class="bet-button" id="startAutoButton">Start</button>
          <button class="bet-button stop-button" id="stopAutoButton" disabled>
            Stop
          </button>
        </div>
      </div>

      <!-- Center/Right Panel: Game Area -->
      <div class="game-area">
        <!-- Dice Animation Container -->
        <div class="dice-container" id="diceContainer">
          <!-- Dice will be dynamically created during animation -->
        </div>

        <div class="slider-container">
          <!-- Scale Values -->
          <div class="scale-values">
            <span>0</span>
            <span>25</span>
            <span>50</span>
            <span>75</span>
            <span>100</span>
          </div>

          <!-- Slider Track -->
          <div class="slider-track">
            <div class="slider-fill-red"></div>
            <div class="slider-thumb" id="sliderThumb"></div>
            <div class="slider-fill-green"></div>
            <div class="vertical-line"></div>
          </div>
        </div>

        <!-- Result Display -->
        <div id="resultDisplay" class="result-display">
          <!-- Result will be displayed here -->
        </div>
      </div>

      <!-- Bottom Panel: Outcome Parameters -->
      <div class="outcome-params">
        <div class="param-section">
          <div class="param-label">Multiplier</div>
          <div class="param-value" id="multiplierDisplay">
            2.0000 <span class="param-unit">x</span>
          </div>
        </div>

        <div class="param-section">
          <div class="param-label">Roll Over</div>
          <div class="param-value">
            <span id="rollTargetDisplay">50.50</span>
            <button class="toggle-btn" id="rollToggle">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
        </div>

        <div class="param-section">
          <div class="param-label">Win Chance</div>
          <div class="param-value" id="winChanceDisplay">
            49.5000 <span class="param-unit">%</span>
          </div>
        </div>
      </div>

      <!-- Footer Bar -->
      <div class="footer-bar">
        <div class="footer-left">
          <button class="icon-btn"><i class="fas fa-cog"></i></button>
          <button class="icon-btn"><i class="fas fa-home"></i></button>
          <button class="icon-btn"><i class="far fa-chart-bar"></i></button>
          <button class="icon-btn"><i class="far fa-star"></i></button>
        </div>

        <div class="footer-center">
          <img src="dice.svg" alt="Stake" class="logo" />
        </div>

        <div class="footer-right">
          <button class="fairness-btn">Fairness</button>
        </div>
      </div>
    </div>

    <!-- Dice Template (Hidden) -->
    <template id="diceTemplate">
      <div class="dice">
        <img src="dice.svg" class="dice-svg" alt="Dice" />
        <span class="dice-value"></span>
      </div>
    </template>

    <!-- History Item Template (Hidden) -->
    <template id="historyItemTemplate">
      <div class="history-item">
        <span class="history-value"></span>
      </div>
    </template>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/sha256.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/hmac-sha256.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <!-- Game Logic -->
    <script src="game.js"></script>
  </body>
</html>
