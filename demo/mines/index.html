<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mines - Modern Gaming Experience</title>
    <style>
      :root {
        /* Modern Color Palette */
        --primary: #667eea;
        --primary-dark: #5a67d8;
        --primary-light: #7c8ff5;
        --secondary: #f56565;
        --secondary-dark: #e53e3e;
        --secondary-light: #fc8181;
        --success: #48bb78;
        --success-dark: #38a169;
        --warning: #ed8936;
        --info: #4299e1;

        /* Neutral Colors */
        --gray-100: #f7fafc;
        --gray-200: #edf2f7;
        --gray-300: #e2e8f0;
        --gray-400: #cbd5e0;
        --gray-500: #a0aec0;
        --gray-600: #718096;
        --gray-700: #4a5568;
        --gray-800: #2d3748;
        --gray-900: #1a202c;

        /* Glass Effect Colors */
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.2);
        --glass-shadow: rgba(0, 0, 0, 0.1);

        /* Gradients */
        --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --gradient-success: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        /* Spacing */
        --space-xs: 0.5rem;
        --space-sm: 0.75rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2rem;
        --space-2xl: 3rem;

        /* Border Radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 1rem;
        --radius-xl: 1.5rem;
        --radius-full: 9999px;

        /* Animations */
        --transition-fast: 150ms ease;
        --transition-base: 250ms ease;
        --transition-slow: 350ms ease;

        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.4);
        --shadow-neumorphism: 6px 6px 12px rgba(0, 0, 0, 0.15), -6px -6px 12px rgba(255, 255, 255, 0.1);
      }

      /* Dark Mode Variables */
      @media (prefers-color-scheme: dark) {
        :root {
          --glass-bg: rgba(0, 0, 0, 0.3);
          --glass-border: rgba(255, 255, 255, 0.1);
          --glass-shadow: rgba(0, 0, 0, 0.3);
          --gradient-bg: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
      }

      /* Global Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        color: white;
      }

      /* Animated Background */
      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--gradient-bg);
        z-index: -2;
      }

      .background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(circle at 20% 80%, rgba(255, 119, 164, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 119, 164, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(118, 75, 162, 0.2) 0%, transparent 50%);
        animation: backgroundShift 20s ease infinite;
      }

      @keyframes backgroundShift {
        0%, 100% {
          transform: translate(0, 0) rotate(0deg);
        }
        33% {
          transform: translate(-20px, -20px) rotate(120deg);
        }
        66% {
          transform: translate(20px, -20px) rotate(240deg);
        }
      }

      /* Floating Particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: float 20s infinite linear;
      }

      @keyframes float {
        from {
          transform: translateY(100vh) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        to {
          transform: translateY(-100vh) translateX(100px);
          opacity: 0;
        }
      }

      /* Main Container */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--space-lg);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      /* Header Section */
      .header {
        text-align: center;
        margin-bottom: var(--space-2xl);
        animation: fadeInDown 0.8s ease;
      }

      .logo {
        font-size: 3.5rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.8) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: var(--space-sm);
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }
        to {
          text-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 50px rgba(102, 126, 234, 0.8);
        }
      }

      .tagline {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 300;
      }

      /* Stats Panel */
      .stats-panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: var(--space-md);
        width: 100%;
        max-width: 600px;
        margin-bottom: var(--space-xl);
        animation: fadeInUp 0.8s ease 0.2s both;
      }

      .stat-card {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        padding: var(--space-md);
        text-align: center;
        transition: all var(--transition-base);
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .stat-label {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: var(--space-xs);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: white;
      }

      /* Game Container */
      .game-wrapper {
        width: 100%;
        max-width: 600px;
        animation: fadeInUp 0.8s ease 0.3s both;
      }

      .game-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-xl);
        padding: var(--space-xl);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition: all var(--transition-slow);
      }

      .game-card:hover {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }

      /* Controls Section */
      .controls-section {
        margin-bottom: var(--space-xl);
      }

      .input-group {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
        flex-wrap: wrap;
        justify-content: center;
      }

      .input-label {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 500;
      }

      .input-wrapper {
        position: relative;
        display: inline-block;
      }

      .mines-input {
        width: 100px;
        padding: var(--space-sm) var(--space-md);
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-md);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        text-align: center;
        transition: all var(--transition-base);
        backdrop-filter: blur(5px);
      }

      .mines-input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        border-color: var(--primary-light);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }

      .mines-input::-webkit-inner-spin-button,
      .mines-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Button Container */
      .button-container {
        display: flex;
        gap: var(--space-md);
        justify-content: center;
        flex-wrap: wrap;
      }

      /* Modern Buttons */
      .btn {
        padding: var(--space-sm) var(--space-xl);
        font-size: 1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        border: none;
        border-radius: var(--radius-full);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all var(--transition-base);
        backdrop-filter: blur(5px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
      }

      .btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .btn:active::before {
        width: 300px;
        height: 300px;
      }

      .btn-primary {
        background: var(--gradient-primary);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: var(--gradient-secondary);
        color: white;
        box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
      }

      .btn-secondary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
      }

      .btn-secondary:not(:disabled) {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }
        50% {
          box-shadow: 0 4px 20px rgba(245, 87, 108, 0.6);
        }
        100% {
          box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
        box-shadow: none;
        animation: none;
      }

      /* Game Container */
      #game-container {
        position: relative;
        border-radius: var(--radius-lg);
        overflow: hidden;
        margin-top: var(--space-xl);
        background: rgba(0, 0, 0, 0.2);
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        min-height: 450px;
      }

      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .loading::after {
        content: '';
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Message Box */
      .message-wrapper {
        margin-top: var(--space-xl);
        animation: fadeInUp 0.8s ease 0.4s both;
      }

      .message-box {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        padding: var(--space-md) var(--space-xl);
        text-align: center;
        font-size: 1.1rem;
        font-weight: 500;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition-base);
        position: relative;
        overflow: hidden;
      }

      .message-box::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }

      .message-box.success {
        background: linear-gradient(135deg, rgba(72, 187, 120, 0.2), rgba(72, 187, 120, 0.1));
        border-color: rgba(72, 187, 120, 0.3);
        color: #68d391;
      }

      .message-box.error {
        background: linear-gradient(135deg, rgba(245, 101, 101, 0.2), rgba(245, 101, 101, 0.1));
        border-color: rgba(245, 101, 101, 0.3);
        color: #fc8181;
      }

      .message-box.warning {
        background: linear-gradient(135deg, rgba(237, 137, 54, 0.2), rgba(237, 137, 54, 0.1));
        border-color: rgba(237, 137, 54, 0.3);
        color: #f6ad55;
      }

      .message-box:not(.success):not(.error):not(.warning)::before {
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        to {
          left: 100%;
        }
      }

      /* Animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .logo {
          font-size: 2.5rem;
        }

        .stats-panel {
          grid-template-columns: repeat(2, 1fr);
        }

        .game-card {
          padding: var(--space-lg);
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: var(--space-md);
        }

        .logo {
          font-size: 2rem;
          letter-spacing: 1px;
        }

        .tagline {
          font-size: 0.95rem;
        }

        .stats-panel {
          grid-template-columns: 1fr;
        }

        .input-group {
          flex-direction: column;
        }

        .button-container {
          flex-direction: column;
          width: 100%;
        }

        .btn {
          width: 100%;
        }

        .game-card {
          padding: var(--space-md);
        }
      }

      /* Dark Mode Adjustments */
      @media (prefers-color-scheme: dark) {
        .stat-card,
        .game-card,
        .message-box {
          background: rgba(0, 0, 0, 0.4);
        }

        .mines-input {
          background: rgba(0, 0, 0, 0.3);
          border-color: rgba(255, 255, 255, 0.1);
        }

        .mines-input:focus {
          background: rgba(0, 0, 0, 0.4);
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated Background -->
    <div class="background"></div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1 class="logo">Mines</h1>
        <p class="tagline">Test your luck, multiply your wins</p>
      </header>

      <!-- Stats Panel -->
      <div class="stats-panel">
        <div class="stat-card">
          <div class="stat-label">Current Bet</div>
          <div class="stat-value">$100</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Best Win</div>
          <div class="stat-value">12.5x</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Games Played</div>
          <div class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Win Rate</div>
          <div class="stat-value">0%</div>
        </div>
      </div>

      <!-- Game Section -->
      <div class="game-wrapper">
        <div class="game-card">
          <!-- Controls -->
          <div class="controls-section">
            <div class="input-group">
              <label class="input-label" for="mines-input">Number of Mines:</label>
              <div class="input-wrapper">
                <input
                  type="number"
                  id="mines-input"
                  class="mines-input"
                  value="3"
                  min="1"
                  max="24"
                />
              </div>
            </div>

            <div class="button-container">
              <button id="start-button" class="btn btn-primary">
                Start Game
              </button>
              <button id="cashout-button" class="btn btn-secondary" disabled>
                Cash Out
              </button>
            </div>
          </div>

          <!-- Game Container -->
          <div id="game-container">
            <div class="loading" id="loading-indicator">Loading</div>
          </div>
        </div>
      </div>

      <!-- Message Box -->
      <div class="message-wrapper">
        <div id="message" class="message-box">
          Set number of mines and press Start to begin
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      // Create floating particles
      function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';

          // Random size
          const size = Math.random() * 4 + 2;
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;

          // Random position
          particle.style.left = `${Math.random() * 100}%`;

          // Random animation delay and duration
          particle.style.animationDelay = `${Math.random() * 20}s`;
          particle.style.animationDuration = `${20 + Math.random() * 10}s`;

          particlesContainer.appendChild(particle);
        }
      }

      // Initialize particles on load
      createParticles();
    </script>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- PixiJS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"
      integrity="sha512-9Che/pADxtzmgRM/Lt7g+wgmgVPNu4qLCOjH+owFqCSpd9HHCi1fMYp+XtfE8nOdRQWUsD0TUNQUc5Z1SwaLyw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Game Script -->
    <script src="game.js"></script>
  </body>
</html>
